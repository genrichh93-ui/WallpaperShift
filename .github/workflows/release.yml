name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - name: Build
        run: ./tools/build.sh
      - name: Smoke tests
        run: node --experimental-vm-modules tests/smoke.mjs
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wallpapershift-gnome51
          path: dist/wallshift@genrichh93-ui.github.io.zip
      - name: Create GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/wallshift@genrichh93-ui.github.io.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "WallpaperShift ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
